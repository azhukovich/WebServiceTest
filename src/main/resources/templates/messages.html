<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Messages</title>
</head>
<body>
<h1>Saved Messages</h1>

<ul>
    <!-- Выводим все сообщения и время -->
    <th:block th:each="msg : ${messages}">
        <span th:text="${msg.createdAt}"></span>
        <span th:text="${msg.text}"></span>
    </th:block>
</ul>

</body>
</html>
