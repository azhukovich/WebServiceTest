<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">

    <!-- Мобильная адаптация -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Посмотреть статистику</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .result-cell {
    max-width: 200px;      /* фиксированная ширина */
    white-space: normal;   /* разрешить перенос строк */
    word-wrap: break-word; /* переносить длинные слова */
    overflow-wrap: break-word;
}
        .date-cell {
    max-width: 100px;      /* фиксированная ширина */
    white-space: nowrap;   /* разрешить перенос строк */
    word-wrap: break-word; /* переносить длинные слова */
    overflow-wrap: break-word;
}
    .color-box {
width: 24px;
height: 24px;
border-radius: 4px;
margin: auto;
}
div.green {
    background-color: #00aa00 !important;
    font-weight: bold;
}
div.yellow {
    background-color: #d4b100 !important;
    font-weight: bold;
}
div.blue {
    background-color: #0066cc !important;
    font-weight: bold;
}
div.gray {
    background-color: #888888 !important;
    font-style: italic;
}
    </style>
</head>
<body class="container mt-4">

<a th:href="@{/sportform}" class="btn btn-primary">Вернуться и добавить результат</a>

<form th:action="@{/sportstats}" method="get" class="row g-3 mb-4">

    <!-- Выбор упражнения -->
    <div class="col-auto">
        <label class="form-label">Упражнение:</label>
        <select name="exercise" class="form-select">
            <option value="">Все</option>

            <option th:each="exerciseName : ${exerciseNames}"
                    th:value="${exerciseName}"
                    th:text="${exerciseName}"
                    th:selected="${exerciseName == selectedExercise}">
            </option>
        </select>
    </div>


    <!-- Выбор периода -->
    <div class="col-auto">
        <label class="form-label">Период:</label>
        <select name="period" class="form-select">
            <option value="week" th:selected="${selectedPeriod == 'week'}">Неделя</option>
            <option value="month" th:selected="${selectedPeriod == 'month'}">Месяц</option>
        </select>
    </div>

    <!-- Кнопка -->
    <div class="col-auto align-self-end">
        <button class="btn btn-success">Показать</button>
    </div>

</form>


<!-- результаты -->
<table class="table table-striped table-bordered mt-4">
    <thead class="table-dark">
    <tr>
        <th>Дата</th>
        <th>Результаты</th>
        <th>Оценка</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="entry : ${resultsByDay}" class="date-cell">
        <td>
            <a  th:text="${entry.key}"
                th:href="@{/sportdetails(exercise='Отжимания', day=${entry.key})}">
            </a>
        </td>
        <td th:text="${entry.value}" class="result-cell">
        </td>
        <td>
            <div th:classappend="${colors[entry.key]}" class="color-box"></div>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
