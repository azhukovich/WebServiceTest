<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <!-- Мобильная адаптация -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Посмотреть статистику</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <style>
        .result-cell {
            min-width: 160px;
            white-space: normal;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        .date-cell {
            min-width: 75px;
            max-width: 100px;
            white-space: nowrap;
        }
        .color-box {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            display: inline-block;
            margin-left: 8px;
            vertical-align: middle;
        }
        .green { background-color: #00aa00 !important; }
        .yellow { background-color: #d4b100 !important; }
        .blue { background-color: #0066cc !important; }
        .red { background-color: #E0115F !important; }
        .gray { background-color: #888888 !important; }
    </style>
</head>

<body class="container mt-4">

<a th:href="@{/sportform}" class="btn btn-primary mb-3">Вернуться и добавить результат</a>

<form th:action="@{/sportstats}" method="get" class="row g-3 mb-4">

    <!-- Выбор упражнения -->
    <div class="col-auto">
        <label class="form-label">Упражнение:</label>
        <select name="exercise" class="form-select">
            <option value="">Все</option>
            <option th:each="exerciseName : ${exerciseNames}"
                    th:value="${exerciseName}"
                    th:text="${exerciseName}"
                    th:selected="${exerciseName == selectedExercise}">
            </option>
        </select>
    </div>


    <!-- Выбор периода -->
    <div class="col-auto">
        <label class="form-label">Период:</label>
        <select name="period" class="form-select">
            <option value="week" th:selected="${selectedPeriod == 'week'}">Неделя</option>
            <option value="month" th:selected="${selectedPeriod == 'month'}">Месяц</option>
        </select>
    </div>

    <!-- Кнопка -->
    <div class="col-auto align-self-end">
        <button class="btn btn-success">Показать</button>
    </div>
</form>


<!-- результаты -->
<table class="table table-striped table-bordered mt-4">
    <thead class="table-dark">
    <tr>
        <th>Дата</th>
        <th>Результаты</th>
        <th>Комментарий</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="entry : ${resultsByDay}">
        <td class="date-cell">
            <a th:text="${#temporals.format(entry.key, 'dd-MM-yy')}"
               th:href="@{/sportdetails(day=${entry.key})}">
            </a>
        </td>

        <!-- Результаты по каждому упражнению -->
        <td class="result-cell">
            <div th:each="res : ${entry.value.getExerciseResults(exerciseNames)}">
                <span th:text="${res.exerciseName} + ': ' + ${res.formatQuantities()}"></span>
                <div class="color-box" th:classappend="${res.colorClass}"></div>
            </div>
        </td>



        <!-- Общий комментарий -->
        <td th:text="${entry.value.formatComments()}"></td>
    </tr>
    </tbody>
</table>

</body>
</html>
