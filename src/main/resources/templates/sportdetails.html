<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <!-- Мобильная адаптация -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Посмотреть статистику</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

<a th:href="@{/sportstats}" class="btn btn-primary">Вернуться к статистике</a>

<!-- результаты -->
<table class="table table-striped table-bordered mt-4">
    <thead class="table-dark">
    <tr>
        <th>Дата</th>
        <th>Результаты</th>
        <th>Комментарий</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="entry : ${resultsByDay}">
        <td th:text="${entry.key}" ></td>
        <td th:text="${entry.value.quantities}"></td>
        <td th:text="${entry.value.comments}"></td>
    </tr>
    </tbody>
</table>

</body>
</html>
