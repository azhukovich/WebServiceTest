<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Добавить данные</title>
</head>
<body>

<h2>Добавить спортивные данные</h2>

<label>Название:</label>
<select id="name" onchange="loadTodayStats()">
    <option th:each="n : ${names}" th:value="${n}" th:text="${n}"></option>
</select>
<br><br>

<label>Количество:</label>
<input type="number" id="quantity" required>
<br><br>

<button onclick="sendJson()">Сохранить</button>

<div id="statsToday" style="margin-top:20px; font-weight:bold;"></div>

<script>
    function loadTodayStats() {
        const name = document.getElementById("name").value;

        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');

        const from = `${yyyy}-${mm}-${dd}`;
        const to = `${yyyy}-${mm}-${dd}`;

        fetch(`/api/sport/stats?name=${encodeURIComponent(name)}&from=${from}&to=${to}`)
            .then(r => r.json())
            .then(data => {
                document.getElementById("statsToday").innerText =
                    `Сегодня: ${data.total}`;
            });
    }
</script>

<!-- Здесь будет появляться сообщение -->
<div id="result" style="margin-top:20px; font-weight:bold;"></div>

<script>
    function sendJson() {
        const name = document.getElementById("name").value;
        const quantity = parseInt(document.getElementById("quantity").value);

        fetch("/api/sport", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                name: name,
                quantity: quantity
            })
        })
        .then(r => r.text())
        .then(msg => document.getElementById("result").innerText = msg)
        .catch(err => {
            document.getElementById("result").innerText =
                "Ошибка: " + err;
        });
    }
</script>

</body>
</html>
