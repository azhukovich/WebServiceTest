<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">

    <!-- Мобильная адаптация -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Добавить данные</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

<h2 class="mb-4">Добавить спортивные данные</h2>

<div class="mb-3">
    <label class="form-label">Название:</label>
    <select id="name" class="form-select" onchange="loadTodayStats()">
        <option th:each="n : ${names}" th:value="${n}" th:text="${n}"></option>
    </select>
</div>

<br><br>

<form id="sportForm" onsubmit="saveAndUpdate(event)">
    <div class="mb-3">
        <label class="form-label">Количество:</label>
        <input type="number" id="quantity" class="form-control" required>
    </div>

    <button type="submit" class="btn btn-primary mt-3">Сохранить</button>
</form>

<!-- Bootstrap-карточка статистики -->
<div class="card mt-4">
    <div class="card-body">
        <h5 class="card-title">Статистика за сегодня</h5>
        <p class="card-text" id="statsToday">Загрузка...</p>
    </div>
</div>

<!-- Сообщение о сохранении -->
<div id="result" class="mt-3 fw-bold"></div>

<script>
    function loadTodayStats() {
        const name = document.getElementById("name").value;

        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');

        const from = `${yyyy}-${mm}-${dd}`;
        const to = `${yyyy}-${mm}-${dd}`;

        fetch(`/api/sport/stats?name=${encodeURIComponent(name)}&from=${from}&to=${to}`)
            .then(r => r.json())
            .then(data => {
                document.getElementById("statsToday").innerText =
                    `Сегодня: ${data.total}`;
            });
    }
</script>

<script>
    async function saveAndUpdate(event) {
    event.preventDefault(); // чтобы страница не перезагружалась

    await sendJson();      // дождаться сохранения
    loadTodayStats();      // только потом обновить статистику
    }
</script>

<script>
    async function sendJson() {
        const name = document.getElementById("name").value;
        const quantity = parseInt(document.getElementById("quantity").value);

        const response = await fetch("/api/sport", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, quantity })
        });

        const msg = await response.text();
        document.getElementById("result").innerText = msg;
    }

</script>
<script>
    window.onload = loadTodayStats;
</script>
</body>
</html>
