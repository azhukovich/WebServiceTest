<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Добавить данные</title>
</head>
<body>

<h2>Добавить спортивные данные</h2>

<label>Название:</label>
<select id="name">
    <option th:each="n : ${names}" th:value="${n}" th:text="${n}"></option>
</select>
<br><br>

<label>Количество:</label>
<input type="number" id="quantity" required>
<br><br>

<button onclick="sendJson()">Сохранить</button>

<script>
    function sendJson() {
        const name = document.getElementById("name").value;
        const quantity = parseInt(document.getElementById("quantity").value);

        fetch("/api/sport", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                name: name,
                quantity: quantity
            })
        })
        .then(r => r.text())
        .then(msg => alert(msg))
        .catch(err => {
            alert("Ошибка: " + err);
        });
    }
</script>

</body>
</html>
