<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <!-- Мобильная адаптация -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Добавить данные</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

<h2 class="mb-4">Добавить спортивные данные</h2>

<div class="mb-3">
    <label class="form-label">Название:</label>
    <select id="name" class="form-select" onchange="loadTodayStats()">
        <option th:each="n : ${names}" th:value="${n}" th:text="${n}"></option>
    </select>
</div>

<br><br>

<form id="sportForm" onsubmit="saveAndUpdate(event)">
    <div class="mb-3">
        <label class="form-label">Количество:</label>
        <input type="number" id="quantity" class="form-control" required>
        <textarea id="comment" class="form-control" placeholder="Комментарий (необязательно)"></textarea>
    </div>
    </div>

    <button type="submit" class="btn btn-primary mt-3">Сохранить</button>
</form>

<!-- Bootstrap-карточка статистики -->
<div class="card mt-4">
    <div class="card-body">
        <h5 class="card-title">Статистика за сегодня</h5>
        <p class="card-text" id="statsToday">Загрузка...</p>
    </div>
</div>

<!-- Сообщение о сохранении -->
<div id="result" class="mt-3 fw-bold"></div>

<!-- Счетчики с последнего упражнения -->
<div id="timersContainer"></div>
<div th:each="entry : ${exerciseTimes}">
    <div class="timer-block"
         th:data-last="${entry.value}">
        <span th:text="${entry.key}"></span> прошло:
        <span class="timer" th:id="'timer-' + ${entry.key}">00:00:00</span>
    </div>
</div>

<!-- Красивый пример -->
<div class="col-md-4 mb-3">
    <div class="card shadow-sm">
        <div class="card-body text-center">
            <h5 class="card-title">
                <i class="bi bi-stopwatch"></i> Отжимания
            </h5>
            <p class="card-text text-muted">Прошло времени:</p>
            <h3 class="text-primary timer" data-last="2026-07-30T20:15:00Z">00:00:00</h3>
            <div class="d-flex justify-content-between mt-3">
                <span class="badge bg-success">Сегодня: 150</span>
                <span class="badge bg-warning text-dark">10 мин назад</span>
            </div>
        </div>
    </div>
</div>


<script>
    let timerInterval = null;

function startTimers() {
    document.querySelectorAll('.timer-block').forEach(block => {
        const dateString = block.dataset.last;
        if (!dateString) return;

        const lastTime = new Date(dateString);
        const timerSpan = block.querySelector('.timer');

        // создаём отдельный интервал для каждого таймера
        setInterval(() => {
            const diff = Date.now() - lastTime.getTime();

            const hours = String(Math.floor(diff / 3600000)).padStart(2, '0');
            const minutes = String(Math.floor((diff % 3600000) / 60000)).padStart(2, '0');
            const seconds = String(Math.floor((diff % 60000) / 1000)).padStart(2, '0');

            timerSpan.textContent = `${hours}:${minutes}:${seconds}`;
        }, 1000);
    });
}
</script>

<script>
    async function loadTodayStats() {
     const name = document.getElementById("name").value;
     const todayUTC = new Date().toISOString().slice(0, 10);

     const response = await fetch(`/api/sport/stats?name=${encodeURIComponent(name)}&from=${todayUTC}&to=${todayUTC}&shiftHours=-3`);
     const data = await response.json();

     // обновляем статистику
     document.getElementById("statsToday").innerText = `Сегодня: ${data.total}`;

     // обновляем список таймеров
     const container = document.getElementById("timersContainer");
     container.innerHTML = ""; // очистить старые блоки

     if (data.exerciseTimes) {
         Object.entries(data.exerciseTimes).forEach(([exercise, time]) => {
             const block = document.createElement("div");
             block.classList.add("timer-block");
             block.dataset.last = time;
             block.innerHTML = `<span>${exercise}</span> прошло: <span class="timer">00:00:00</span>`;
             container.appendChild(block);
         });
     }

     // запускать таймеры только после вставки новых элементов
     startTimers();
 }
</script>



<!-- результаты за неделю -->
<a th:href="@{/sportstats}" class="btn btn-primary">Статистика</a>

<script>
    async function saveAndUpdate(event) {
    event.preventDefault(); // чтобы страница не перезагружалась

    await sendJson();      // дождаться сохранения
    await loadTodayStats();      // только потом обновить статистику
    // перегрузить страницу через n миллисекунд
    setTimeout(() => {    location.reload();    }, 1500);
    }
</script>

<script>
    async function saveCommentAndUpdate(event) {
    event.preventDefault(); // чтобы страница не перезагружалась

    await sendComment();      // дождаться сохранения
    await loadTodayStats();      // только потом обновить статистику
    // перегрузить страницу через n миллисекунд
    setTimeout(() => {    location.reload();    }, 1500);
    }
</script>

<script>
    async function sendJson() {
        const name = document.getElementById("name").value;
        const comment = document.getElementById("comment").value;
        const quantity = parseInt(document.getElementById("quantity").value);

        const response = await fetch("/api/sport", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, quantity, comment })
        });

        const msg = await response.text();
        document.getElementById("result").innerText = msg;
    }
</script>

<script>
    window.onload = () => {
    loadTodayStats();
    startTimers();
};
</script>
</body>
</html>
